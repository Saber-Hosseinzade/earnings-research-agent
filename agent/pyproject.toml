[project]
name = "earnings-research-agent"
version = "0.1.0"
description = "Strands agent that summarises earnings calls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-opentelemetry-distro>=0.21.0",
    "bedrock-agentcore>=1.24.0",
    "boto3",
    "pydantic>=2",
    "strands-agents>=1.61.0",
]

[tool.uv]
# An application deployed as files, not a package to build and install.
package = false
