[project]
name = "earnings-research-ui"
version = "0.1.0"
description = "Streamlit chat UI for the earnings research agent (calls the AgentCore Runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "streamlit>=1.60",
]

[tool.uv]
# An application run as files, not a package to build and install.
package = false
# Releases newer than this are not picked: no dependency younger than two weeks at lock time.
exclude-newer = "2026-11-06T00:00:00Z"
